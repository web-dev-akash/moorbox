name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Install build tools
        run: brew install xcodegen create-dmg
      - name: Tests
        run: |
          swift test
          make test-ui
      - name: Universal Release build + DMG
        run: make dmg
      - name: Source tarball checksum (for the Homebrew formula)
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o source.tar.gz
          echo "SOURCE_SHA256=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## \\[$(cat VERSION)\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          {
            echo "$NOTES"
            echo
            echo "### Install"
            echo "- **DMG:** open it and drag Moorbox to Applications. The build is not notarized: on first launch, open System Settings → Privacy & Security and click **Open Anyway**."
            echo "- **Homebrew (builds from source, needs Xcode):** \`brew install web-dev-akash/moorbox/moorbox\`"
            echo
            echo "Formula values for this release: \`url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz\"\`, \`sha256 \"${SOURCE_SHA256}\"\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/Moorbox-*.dmg dist/Moorbox-*.dmg.sha256 dist/Moorbox-*.zip dist/Moorbox-*.zip.sha256 \
            --title "Moorbox $(cat VERSION)" --notes-file notes.md --draft
