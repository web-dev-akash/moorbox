# XcodeGen spec. Generate the Xcode project with `make project` (or
# `MOORBOX_VERSION=$(cat VERSION) xcodegen generate`). Moorbox.xcodeproj is generated and
# not committed; this file is the source of truth.
name: Moorbox
options:
  bundleIdPrefix: io.github.web-dev-akash
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: ${MOORBOX_VERSION}
    CURRENT_PROJECT_VERSION: ${MOORBOX_BUILD}
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Open-source builds are ad-hoc signed; maintainers can override CODE_SIGN_IDENTITY
    # and DEVELOPMENT_TEAM on the xcodebuild command line.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      CLANG_ENABLE_CODE_COVERAGE: NO

packages:
  MoorboxCore:
    path: .

targets:
  Moorbox:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MoorboxCore
        product: MoorboxCore
      - package: MoorboxCore
        product: EmulatorControl
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Moorbox
        CFBundleName: Moorbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 The Moorbox Authors. Apache License 2.0."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.web-dev-akash.Moorbox
        PRODUCT_NAME: Moorbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: Moorbox runs the Android SDK tools and the emulator from the user's
        # SDK folder, which the App Sandbox does not allow.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  MoorboxUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Moorbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.web-dev-akash.MoorboxUITests
        TEST_TARGET_NAME: Moorbox
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Moorbox:
    build:
      targets:
        Moorbox: all
        MoorboxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: MoorboxCore/MoorboxCoreTests
        - name: MoorboxUITests
    archive:
      config: Release
